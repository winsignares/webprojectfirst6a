<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte Exitoso - CampusLink</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f6f9;
            color: #333;
        }
        header {
            background-color: #5d1b1b;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }
        nav a:hover {
            color: #ffc72c;
        }
        .container {
            max-width: 600px;
            margin: 4rem auto;
            background: white;
            padding: 40px 30px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            text-align: center;
        }
        .success-icon {
            font-size: 4rem;
            color: #27ae60;
            margin-bottom: 20px;
        }
        h2 {
            color: #5d1b1b;
            margin-top: 0;
            margin-bottom: 15px;
        }
        p {
            color: #666;
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .btn-container {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .btn {
            background-color: #ffc72c;
            color: #5d1b1b;
            padding: 12px 20px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #e6b325;
        }
        .btn-secondary {
            background-color: #5d1b1b;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #45171a;
        }
    </style>
</head>
<body>

    <header>
        <h2>CampusLink</h2>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Ver Objetos</a>
            <a href="Reportar.html">Reportar Objeto</a>
        </nav>
    </header>

    <div class="container">
        <div class="success-icon">✔️</div>
        <h2>¡Reporte Publicado con Éxito!</h2>
        <p>Tu información ha sido registrada correctamente en el sistema de objetos perdidos de la universidad. La comunidad ya puede visualizar el reporte.</p>
        
        <div class="btn-container">
            <a href="catalogo.html" class="btn">Ver en el Catálogo</a>
            <a href="index.html" class="btn btn-secondary">Volver al Inicio</a>
        </div>
    </div>

</body>
</html>
